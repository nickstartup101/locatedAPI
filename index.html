/* DYNAMIC GIS SPATIAL DENSITY ENGINE */
function getDynamicGISScanFromCoords(lat, lng, activeFilters) {
    const centerLat = 17.9638;
    const centerLng = 102.6111;
    
    const distFromCenter = Math.sqrt(Math.pow(lat - centerLat, 2) + Math.pow(lng - centerLng, 2));
    const microNoise = Math.abs(Math.sin(lat * 1234.5) + Math.cos(lng * 6789.1)); 
    
    let baseDensity = Math.max(1, Math.min(10, Math.round(10 - (distFromCenter * 80) + (microNoise * 3))));
    
    const offices = activeFilters.offices ? Math.min(10, Math.max(1, Math.round(baseDensity * 0.9 + (microNoise * 2)))) : 2;
    const banks = activeFilters.banks ? Math.min(10, Math.max(1, Math.round(baseDensity * 0.7 + (microNoise * 1.5)))) : 1;
    const popTarget = activeFilters.population ? Math.min(10, Math.max(1, Math.round(baseDensity * 1.1))) : 3;
    const traffic = Math.min(10, Math.max(1, Math.round(baseDensity * 0.95 + microNoise)));
    const facility = Math.min(10, Math.max(2, Math.round(9 - (baseDensity * 0.3)))); 
    const competition = activeFilters.competitors ? Math.min(10, Math.max(1, Math.round(baseDensity * 0.8 + microNoise))) : 2;

    return { offices, banks, popTarget, traffic, facility, competition };
}

function calculateAutoLocationScore(f) {
    const popScore = (f.popTarget || 1) * 3.0; 
    const trafficScore = (f.traffic || 1) * 2.5; 
    const poiScore = (((f.offices || 1) + (f.banks || 1)) / 2) * 2.0; 
    const facilityScore = (f.facility || 5) * 1.5; 
    const compPenalty = (f.competition || 1) * 1.0; 
    
    const rawScore = popScore + trafficScore + poiScore + facilityScore - compPenalty;
    return Math.min(Math.max(Math.round(rawScore), 10), 100);
}

function getGradeInfo(score) {
    if (score >= 80) return { grade: "A+", text: "ເໝາະສົມລົງທຶນສູງຫຼາຍ (Prime Location)", color: "text-green-700 bg-green-50 border-green-200" };

}

}

/* =========================================================================
   INTERACTIVE PINNING MAP COMPONENT
   ========================================================================= */
function InteractivePinMap({ lat, lng, onPinChange }) {
    const mapContainerRef = useRef(null);
    const mapInstance = useRef(null);
    const markerInstance = useRef(null);
    const circleInstance = useRef(null);

    useEffect(() => {
        if (!mapContainerRef.current) return;

        if (!mapInstance.current) {
            const map = L.map(mapContainerRef.current).setView([lat, lng], 15);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            const marker = L.marker([lat, lng], { draggable: true }).addTo(map);
            const circle = L.circle([lat, lng], {
                color: '#1D6FB8',
                fillColor: '#1D6FB8',
                fillOpacity: 0.15,
                radius: 500
            }).addTo(map);

            marker.on('dragend', function () {
                const pos = marker.getLatLng();
                circle.setLatLng(pos);
                onPinChange(pos.lat, pos.lng);
            });

            map.on('click', function (e) {
                marker.setLatLng(e.latlng);
                circle.setLatLng(e.latlng);
                onPinChange(e.latlng.lat, e.latlng.lng);
            });

            mapInstance.current = map;
            markerInstance.current = marker;
            circleInstance.current = circle;
        } else {
            mapInstance.current.setView([lat, lng], 15);
            markerInstance.current.setLatLng([lat, lng]);
            circleInstance.current.setLatLng([lat, lng]);
        }
    }, [lat, lng]);

    return React.createElement("div", { className: "space-y-1" },
        React.createElement("div", { id: "leaflet-map", ref: mapContainerRef, className: "border-2 border-brand-500 shadow-inner" }),
        React.createElement("p", { className: "text-[10px] text-gray-500 text-center font-medium" },
            "💡 ກົດໃສ່ບ່ອນໃດກໍໄດ້ໃນແຜນທີ່ ຫຼື ລາກໝຸດ 📍 ເພື່ອຍ້າຍຈຸດປະເມີນ (ວົງມົນແທນໄລຍະ 500 ແມັດ)"
        )
    );
}

function BreakEvenSection({ data, setData, formatNum, openReportModal }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  const marginRatio = 1 - (data.cogsPercent / 100);
  const monthlySales = data.dailySales * 30;
  const grossProfit = monthlySales * marginRatio;
  const netProfit = grossProfit - data.opex;
  const breakEvenDailySales = Math.ceil((data.opex / 30) / marginRatio);
  const paybackMonths = netProfit > 0 ? (data.capex / netProfit).toFixed(1) : '∞';

  const pessDailySales = data.dailySales * 0.7;
  const pessNetProfit = (pessDailySales * 30 * marginRatio) - data.opex;
  const pessPayback = pessNetProfit > 0 ? (data.capex / pessNetProfit).toFixed(1) + " ເດືອນ" : "ຂາດທຶນ";

  const optDailySales = data.dailySales * 1.3;
  const optNetProfit = (optDailySales * 30 * marginRatio) - data.opex;
  const optPayback = optNetProfit > 0 ? (data.capex / optNetProfit).toFixed(1) + " ເດືອນ" : "ຂາດທຶນ";

  useEffect(() => {
    if (!chartRef.current) return;
    const ctx = chartRef.current.getContext('2d');
    if (chartInstance.current) chartInstance.current.destroy();

    const monthsToPlot = Math.min(Math.max(Math.ceil(Number(paybackMonths) * 1.5 || 12), 6), 24);
    const labels = [];
    const cashFlowData = [];
    const zeroLine = [];

    for (let m = 0; m <= monthsToPlot; m++) {
      labels.push(`ເດືອນ ${m}`);
      cashFlowData.push(-data.capex + (netProfit * m));
      zeroLine.push(0);
    }

    chartInstance.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: 'ກະແສເງິນສົດສະສົມ (Cumulative Cash Flow)', data: cashFlowData, borderColor: '#1D6FB8', backgroundColor: 'rgba(29, 111, 184, 0.1)', fill: true, tension: 0.2, borderWidth: 2 },
          { label: 'ຈຸດກຸ້ມທຶນ (0)', data: zeroLine, borderColor: '#EF4444', borderDash: [4, 4], pointRadius: 0, borderWidth: 1.5 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });

    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [data, netProfit, paybackMonths]);

  return React.createElement("div", { className: "space-y-6" },
    React.createElement("div", { className: "grid grid-cols-1 lg:grid-cols-12 gap-6" },

          React.createElement("label", { className: "block text-xs font-semibold mb-1" }, "CAPEX ຕົ້ນທຶນກໍ່ສ້າງເລີ່ມຕົ້ນ"),
          React.createElement("input", { type: "number", value: data.capex, onChange: e => setData({...data, capex: Number(e.target.value)}), className: "w-full border rounded p-2 text-right text-sm" })
        ),
        React.createElement("div", null,
          React.createElement("label", { className: "block text-xs font-semibold mb-1" }, "OPEX ຄ່າໃຊ້ຈ່າຍຄົງທີ່/ເດືອນ"),
          React.createElement("input", { type: "number", value: data.opex, onChange: e => setData({...data, opex: Number(e.target.value)}), className: "w-full border rounded p-2 text-right text-sm" })
        ),
        React.createElement("div", null,
          React.createElement("label", { className: "block text-xs font-semibold mb-1" }, "ຍອດຂາຍສະເລ່ຍ/ມື້"),
          React.createElement("input", { type: "number", value: data.dailySales, onChange: e => setData({...data, dailySales: Number(e.target.value)}), className: "w-full border rounded p-2 text-right text-sm" })
        ),
        React.createElement("div", null,
          React.createElement("label", { className: "block text-xs font-semibold mb-1" }, "ຕົ້ນທຶນສິນຄ້າ COGS (%)"),
          React.createElement("input", { type: "number", value: data.cogsPercent, onChange: e => setData({...data, cogsPercent: Number(e.target.value)}), className: "w-full border rounded p-2 text-right text-sm" })

/* =========================================================================
   FULL RECIPE SUITE COMPONENT
   ========================================================================= */
function FullRecipeSuite({
  ingredients, recipes, presets, categories,
  activeSopRecipe, setActiveSopRecipe,
  sopCheckedSteps, setSopCheckedSteps,
  editingRecipe, setEditingRecipe,
  recipeSubTab, setRecipeSubTab,
  saveRecipeSuiteToFirebase, openReportModal
}){
  const [search, setSearch] = useState("");
  const [bName, setBName] = useState("");
  const [bCategory, setBCategory] = useState(categories[0] || "");
  const [bServings, setBServings] = useState("");
  const [bItems, setBItems] = useState([{ ingredientId: "", qty: "", unit: "g" }]);
  const [bSteps, setBSteps] = useState("");
  const [bNotes, setBNotes] = useState("");

  useEffect(() => {
    if (editingRecipe) {
      setBName(editingRecipe.name || "");
      setBCategory(editingRecipe.category || categories[0] || "");
      setBServings(editingRecipe.servings || "");
      setBSteps(editingRecipe.steps || "");
      setBNotes(editingRecipe.notes || "");
      const mapped = (editingRecipe.items || []).map(it => {
        const found = ingredients.find(ing => ing.name === it.name);
        return { ingredientId: found ? found.id : "", qty: it.qty, unit: it.unit };
      });
      setBItems(mapped.length ? mapped : [{ ingredientId: "", qty: "", unit: "g" }]);
    }
  }, [editingRecipe]);

  const handleSaveRecipe = () => {
    if (!bName.trim()) return alert("ກະລຸນາໃສ່ຊື່ສູດອາຫານ");
    const recipeItems = bItems.filter(it => it.ingredientId && it.qty).map(it => {
      const ing = ingredients.find(i => i.id === it.ingredientId);
      return { name: ing ? ing.name : "", qty: it.qty, unit: it.unit };
    });
    
    let nextRecipes;
    if (editingRecipe) {
      nextRecipes = recipes.map(r => r.id === editingRecipe.id ? { ...r, name: bName.trim(), category: bCategory, servings: bServings, items: recipeItems, steps: bSteps, notes: bNotes } : r);
    } else {
      nextRecipes = [{ id: uid("rec"), name: bName.trim(), category: bCategory || "ອື່ນໆ", servings: bServings, items: recipeItems, steps: bSteps, notes: bNotes, createdAt: Date.now() }, ...recipes];
    }
    saveRecipeSuiteToFirebase(null, nextRecipes, null, null);
    setEditingRecipe(null);
    setRecipeSubTab("sop");
  };

  return React.createElement("div", { className: "bg-white p-6 rounded-xl border shadow-sm space-y-6" },
    React.createElement("div", { className: "flex justify-between items-center border-b pb-4 flex-wrap gap-2" },
      React.createElement("h2", { className: "text-xl font-bold text-brand-900" }, "3. Recipe Builder & SOP Suite"),
      React.createElement("div", { className: "flex gap-2" },
        [
          { id: "sop", label: "📋 SOP ພະນັກງານ" },
          { id: "builder", label: editingRecipe ? "✏️ ແກ້ໄຂສູດ" : "➕ ສ້າງສູດໃໝ່" },
          { id: "ingredients", label: "📦 ຄັງວັດຖຸດິບ (" + ingredients.length + ")" },
          { id: "presets", label: "🏪 ພຣີເຊັດສາຂາ" }
        ].map(st => React.createElement("button", {
          key: st.id,
          onClick: () => setRecipeSubTab(st.id),
          className: `px-3 py-1.5 text-xs font-semibold rounded-lg border ${recipeSubTab === st.id ? 'bg-brand-500 text-white' : 'bg-gray-50'}`
        }, st.label))
      )
    ),

    recipeSubTab === "sop" && React.createElement("div", { className: "grid grid-cols-1 lg:grid-cols-12 gap-6" },
      React.createElement("div", { className: "lg:col-span-5 space-y-3" },
        React.createElement("input", { type: "text", placeholder: "🔍 ປ້ອນຊື່ສູດ...", value: search, onChange: e => setSearch(e.target.value), className: "w-full border rounded p-2 text-xs" }),
        recipes.map(r => React.createElement("div", {
          key: r.id,
          onClick: () => setActiveSopRecipe(r),
          className: `p-3 rounded-lg border cursor-pointer ${activeSopRecipe && activeSopRecipe.id === r.id ? 'border-brand-500 bg-brand-50' : ''}`
        },
          React.createElement("h4", { className: "font-bold text-sm" }, r.name),
          React.createElement("p", { className: "text-xs text-gray-500" }, r.items.length + " ສ່ວນປະສົມ")
        ))
      ),
      React.createElement("div", { className: "lg:col-span-7" },
        activeSopRecipe ? React.createElement("div", { className: "sop-card space-y-3" },
          React.createElement("h3", { className: "font-bold text-lg text-brand-900" }, activeSopRecipe.name),
          React.createElement("ul", { className: "text-xs space-y-1" },
            activeSopRecipe.items.map((it, i) => React.createElement("li", { key: i }, it.name + ": " + it.qty + " " + it.unit))
          )
        ) : React.createElement("p", { className: "text-gray-400 py-12 text-center" }, "ເລືອກສູດເພື່ອເບິ່ງ SOP")
      )
    ),

    recipeSubTab === "builder" && React.createElement("div", { className: "space-y-4" },
      React.createElement("input", { type: "text", value: bName, onChange: e => setBName(e.target.value), placeholder: "ຊື່ສູດອາຫານ *", className: "w-full border rounded p-2 text-xs" }),
      React.createElement("textarea", { rows: "3", value: bSteps, onChange: e => setBSteps(e.target.value), placeholder: "ຂັ້ນຕອນ SOP...", className: "w-full border rounded p-2 text-xs" }),
      React.createElement("button", { onClick: handleSaveRecipe, className: "bg-brand-500 text-white px-4 py-2 text-xs font-bold rounded" }, "💾 ບັນທຶກສູດ")
    )
  );
}
