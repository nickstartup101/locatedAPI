/* DYNAMIC GIS SPATIAL DENSITY ENGINE */
function getDynamicGISScanFromCoords(lat, lng, activeFilters) {
    const centerLat = 17.9638;
    const centerLng = 102.6111;
    const distFromCenter = Math.sqrt(Math.pow(lat - centerLat, 2) + Math.pow(lng - centerLng, 2));
    const microNoise = Math.abs(Math.sin(lat * 1234.5) + Math.cos(lng * 6789.1)); 
    let baseDensity = Math.max(1, Math.min(10, Math.round(10 - (distFromCenter * 80) + (microNoise * 3))));
    
    const offices = activeFilters.offices ? Math.min(10, Math.max(1, Math.round(baseDensity * 0.9 + (microNoise * 2)))) : 2;
    const banks = activeFilters.banks ? Math.min(10, Math.max(1, Math.round(baseDensity * 0.7 + (microNoise * 1.5)))) : 1;
    const popTarget = activeFilters.population ? Math.min(10, Math.max(1, Math.round(baseDensity * 1.1))) : 3;
    const traffic = Math.min(10, Math.max(1, Math.round(baseDensity * 0.95 + microNoise)));
    const facility = Math.min(10, Math.max(2, Math.round(9 - (baseDensity * 0.3)))); 
    const competition = activeFilters.competitors ? Math.min(10, Math.max(1, Math.round(baseDensity * 0.8 + microNoise))) : 2;

    return { offices, banks, popTarget, traffic, facility, competition };
}

function calculateAutoLocationScore(f) {
    const popScore = (f.popTarget || 1) * 3.0; 
    const trafficScore = (f.traffic || 1) * 2.5; 
    const poiScore = (((f.offices || 1) + (f.banks || 1)) / 2) * 2.0; 
    const facilityScore = (f.facility || 5) * 1.5; 
    const compPenalty = (f.competition || 1) * 1.0; 
    
    const rawScore = popScore + trafficScore + poiScore + facilityScore - compPenalty;
    return Math.min(Math.max(Math.round(rawScore), 10), 100);
}

function getGradeInfo(score) {
    if (score >= 80) return { grade: "A+", text: "ເໝາະສົມລົງທຶນສູງຫຼາຍ (Prime Location)", color: "text-green-700 bg-green-50 border-green-200" };
    if (score >= 65) return { grade: "B", text: "ເໝາະສົມ (Good Location)", color: "text-blue-700 bg-blue-50 border-blue-200" };

}

/* =========================================================================

function InteractivePinMap({ lat, lng, onPinChange }) {
    const mapContainerRef = useRef(null);
    const mapInstance = useRef(null);
    const markerInstance = useRef(null);
    const circleInstance = useRef(null);

    useEffect(() => {
        if (!mapContainerRef.current) return;

        if (!mapInstance.current) {
            const map = L.map(mapContainerRef.current).setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

            const marker = L.marker([lat, lng], { draggable: true }).addTo(map);
            const circle = L.circle([lat, lng], { color: '#1D6FB8', fillColor: '#1D6FB8', fillOpacity: 0.15, radius: 500 }).addTo(map);

            marker.on('dragend', function () {
                const pos = marker.getLatLng();
                circle.setLatLng(pos);
                onPinChange(pos.lat, pos.lng);
            });

            map.on('click', function (e) {
                marker.setLatLng(e.latlng);
                circle.setLatLng(e.latlng);
                onPinChange(e.latlng.lat, e.latlng.lng);
            });

            mapInstance.current = map;
            markerInstance.current = marker;
            circleInstance.current = circle;
        } else {
            mapInstance.current.setView([lat, lng], 15);
            markerInstance.current.setLatLng([lat, lng]);
            circleInstance.current.setLatLng([lat, lng]);
        }
    }, [lat, lng]);

    return React.createElement("div", { className: "space-y-1" },
        React.createElement("div", { id: "leaflet-map", ref: mapContainerRef, className: "border-2 border-brand-500 shadow-inner" }),
        React.createElement("p", { className: "text-[10px] text-gray-500 text-center font-medium" }, "💡 ກົດໃສ່ບ່ອນໃດກໍໄດ້ໃນແຜນທີ່ ຫຼື ລາກໝຸດ 📍 ເພື່ອຍ້າຍຈຸດປະເມີນ (ລັດສະໝີ 500m)")
    );
}

        React.createElement("button", { onClick: handleSavePreset, className: "w-full bg-brand-500 text-white text-xs py-2 rounded font-bold" }, "☁️ ບັນທຶກພຣີເຊັດຂຶ້ນ Cloud")
      ),
      React.createElement("div", { className: "space-y-2" },
        React.createElement("h3", { className: "font-bold text-sm text-brand-900" }, "ລາຍການພຣີເຊັດສາຂາ"),
        presets.length === 0 ? React.createElement("p", { className: "text-xs text-gray-400" }, "ຍັງບໍ່ມີພຣີເຊັດ") :
        presets.map(p => React.createElement("div", { key: p.id, className: "p-3 border rounded-lg bg-gray-50" },
          React.createElement("h4", { className: "font-bold text-xs text-brand-900" }, p.name),
          React.createElement("p", { className: "text-[11px] text-gray-500 mt-1" }, p.recipeIds.length + " ເມນູໃນສາຂານີ້")
        ))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

</body>
</html>
